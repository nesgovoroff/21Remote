name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD: ${{ github.run_number }}
  UPDATE_REPO: ${{ github.repository }}

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Test the engine
        run: .github/step.sh "go test" go test -count=1 -v ./...

      - name: Build 21 Remote.app
        run: |
          python3 -m pip install --break-system-packages --quiet pillow || python3 -m pip install --quiet pillow
          .github/step.sh "build app" ./macos/build.sh

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: plugins/build/_deps
          key: juce-8.0.4-${{ runner.os }}-v1

      - name: Build plug-ins (AU + VST3, universal)
        run: |
          .github/step.sh "cmake configure" cmake -S plugins -B plugins/build -DCMAKE_BUILD_TYPE=Release
          .github/step.sh "plug-in build" cmake --build plugins/build --config Release -j 4 \
            --target RemoteChannel_AU RemoteChannel_VST3 RemoteOverview_AU RemoteOverview_VST3 -- -k

      - name: Collect and sign plug-ins
        run: |
          mkdir -p dist/plugins/Components dist/plugins/VST3
          for p in RemoteChannel RemoteOverview; do
            cp -R plugins/build/${p}_artefacts/Release/AU/*.component dist/plugins/Components/
            cp -R plugins/build/${p}_artefacts/Release/VST3/*.vst3 dist/plugins/VST3/
          done
          for b in dist/plugins/Components/*.component dist/plugins/VST3/*.vst3; do
            codesign --force --deep --sign - "$b"
          done
          lipo -info "dist/plugins/VST3/21 Channel.vst3/Contents/MacOS/21 Channel"

      - name: Validate Audio Units (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/plugins/Components/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          .github/step.sh "auval 21 Channel" auval -v aufx R21c Rm21
          .github/step.sh "auval 21 Overview" auval -v aufx R21o Rm21

      - name: Build the installer package
        run: |
          .github/step.sh "pkg" ./macos/pkg.sh
          ls -la dist/*.pkg
          pkgutil --expand "dist/21-Remote-$VERSION.pkg" x
          for c in x/*.pkg; do echo "== $c"; pkgutil --payload-files "$c" | grep -E "MacOS/[^/]+$|jsfx$" || true; done

      - uses: actions/upload-artifact@v4
        with:
          name: 21-Remote-${{ env.VERSION }}
          path: dist/21-Remote-${{ env.VERSION }}.pkg

      # a release is published when VERSION names a version that has none yet
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; raise VERSION to publish a new one"
            exit 0
          fi
          if [ -f "notes/$VERSION.md" ]; then cp "notes/$VERSION.md" notes.txt
          else git log -1 --format='%B' "$GITHUB_SHA" | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > notes.txt; fi
          gh release create "v$VERSION" "dist/21-Remote-$VERSION.pkg" \
            --latest --target "$GITHUB_SHA" --title "21 Remote $VERSION" --notes-file notes.txt
